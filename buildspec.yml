version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - 'echo "[install] node=$(node -v) npm=$(npm -v)"'
      - npm ci --no-audit --no-fund

  pre_build:
    commands:
      - 'echo "[pre_build] tenant=$TENANT_NAME env=$ENVIRONMENT api_url=$API_URL"'
      - export VITE_API_URL="$API_URL"
      - export VITE_TENANT_NAME="$TENANT_NAME"
      - export VITE_ENVIRONMENT="$ENVIRONMENT"

  build:
    commands:
      - 'echo "[build] running production build"'
      - npm run build
      - 'test -d dist'

  post_build:
    commands:
      - 'echo "[deploy] syncing dist to s3"'
      - aws s3 sync dist/ s3://$SITE_BUCKET/ --delete --cache-control "public, max-age=31536000, immutable" --exclude "index.html" --exclude "*.html"
      - aws s3 cp dist/index.html s3://$SITE_BUCKET/index.html --cache-control "no-cache, no-store, must-revalidate" --content-type "text/html; charset=utf-8"
      - 'echo "[deploy] invalidating CloudFront"'
      - aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --paths "/*"
      - 'echo "[deploy] done"'

artifacts:
  files:
    - 'dist/**/*'
  base-directory: '.'

cache:
  paths:
    - 'node_modules/**/*'