# ═══════════════════════════════════════════════════════════════════════
# buildspec.yml — Frontend Finanz B2B (React/Vite o Flutter Web)
# Eseguito da CodeBuild su istanza effimera. Build → Sync S3 → Invalidate CF.
# Variabili d'ambiente iniettate dal modulo static_site_pipeline:
#   SITE_BUCKET, CLOUDFRONT_DISTRIBUTION_ID, TENANT_NAME, ENVIRONMENT, API_URL
# ═══════════════════════════════════════════════════════════════════════
version: 0.2

env:
  variables:
    NODE_ENV: production

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "[install] Node $(node -v) | npm $(npm -v)"
      - npm ci --no-audit --no-fund

  pre_build:
    commands:
      - echo "[pre_build] Building $TENANT_NAME ($ENVIRONMENT) for API_URL=$API_URL"
      # Vite legge le env var prefissate VITE_*. Per CRA: REACT_APP_*. Per Flutter: --dart-define.
      - export VITE_API_URL="$API_URL"
      - export VITE_TENANT_NAME="$TENANT_NAME"
      - export VITE_ENVIRONMENT="$ENVIRONMENT"

  build:
    commands:
      - echo "[build] Running production build..."
      - npm run build
      - test -d dist || (echo "ERROR: dist/ non prodotto da npm run build" && exit 1)

  post_build:
    commands:
      - echo "[deploy] Syncing dist/ -> s3://$SITE_BUCKET/"
      # Asset hashati (JS/CSS/img con hash nel filename) → cache infinita
      - |
        aws s3 sync dist/ s3://$SITE_BUCKET/ \
          --delete \
          --cache-control "public, max-age=31536000, immutable" \
          --exclude "index.html" \
          --exclude "*.html" \
          --exclude "service-worker.js" \
          --exclude "manifest.json"
      # HTML/manifest/SW → no-cache (così un nuovo deploy è visibile entro 60s)
      - |
        aws s3 cp dist/index.html s3://$SITE_BUCKET/index.html \
          --cache-control "no-cache, no-store, must-revalidate" \
          --content-type "text/html; charset=utf-8"
      - |
        if [ -f dist/manifest.json ]; then
          aws s3 cp dist/manifest.json s3://$SITE_BUCKET/manifest.json \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/manifest+json"
        fi
      - |
        if [ -f dist/service-worker.js ]; then
          aws s3 cp dist/service-worker.js s3://$SITE_BUCKET/service-worker.js \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/javascript"
        fi
      - echo "[deploy] Invalidating CloudFront $CLOUDFRONT_DISTRIBUTION_ID"
      - |
        INVALIDATION_ID=$(aws cloudfront create-invalidation \
          --distribution-id $CLOUDFRONT_DISTRIBUTION_ID \
          --paths "/*" \
          --query 'Invalidation.Id' \
          --output text)
      - echo "[deploy] Invalidation $INVALIDATION_ID created. Done."

artifacts:
  files:
    - 'dist/**/*'
  base-directory: '.'
  name: dist-$(date +%Y-%m-%d-%H-%M-%S)

cache:
  paths:
    - 'node_modules/**/*'
